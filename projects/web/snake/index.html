<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <style>
    :root { --gold:#ffcc00; --dim:#8a6a00; --bg:#0e0800; }
    * { box-sizing:border-box; margin:0; padding:0; touch-action:manipulation; }
    body {
      background: var(--bg);
      color: var(--gold);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      justify-content: flex-start; overflow-x: hidden;
      background-image: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.12) 2px,rgba(0,0,0,0.12) 4px);
    }
    h1 {
      font-size: clamp(2rem,10vw,4rem); font-weight: bold; letter-spacing: 0.28em;
      text-shadow: 0 0 20px rgba(255,204,0,0.8), 0 0 40px rgba(255,204,0,0.4);
      margin: clamp(0.4rem,2vw,1rem) 0 0.1em;
    }
    .subtitle { font-size: clamp(0.6rem,3vw,1rem); letter-spacing: 0.12em; color: var(--dim); text-align: center; margin-bottom: clamp(0.5rem,2vw,1rem); }
    .screen { display:none; width:100%; flex-direction:column; align-items:center; }
    .screen.active { display:flex; }

    /* SETUP */
    .diff-grid { display:flex; gap:0.6rem; justify-content:center; width:min(90vw,400px); margin-bottom:0.8rem; }
    .diff-btn {
      flex:1; font-family:inherit; font-weight:bold;
      background:#1a0e00; border:2px solid var(--dim); border-radius:8px;
      color:var(--dim); cursor:pointer; padding:0.6em 0.5em;
      font-size:clamp(0.7rem,3vw,1rem); letter-spacing:0.08em; transition:all 0.1s;
    }
    .diff-btn.sel { color:var(--gold); border-color:var(--gold); background:#2a1800; }
    .records-box {
      width:min(90vw,400px); border:1px solid #3a2200; border-radius:8px;
      padding:0.6em 0.8em; margin-bottom:0.8rem;
    }
    .rec-title { font-size:clamp(0.55rem,2.2vw,0.8rem); letter-spacing:0.18em; color:var(--dim); text-align:center; border-bottom:1px solid #3a2200; padding-bottom:0.3em; margin-bottom:0.4em; }
    .rec-row { display:flex; align-items:center; gap:0.4em; font-size:clamp(0.5rem,2vw,0.72rem); padding:0.15em 0; border-bottom:1px solid rgba(90,58,0,0.3); }
    .rec-rank { color:var(--dim); min-width:1.5em; }
    .rec-name { color:#ffcc88; font-weight:900; min-width:2.4em; font-size:0.95em; }
    .rec-val  { color:var(--gold); font-weight:bold; }
    .rec-empty { color:#4a3200; font-size:0.85em; text-align:center; padding:0.3em 0; }
    .start-btn {
      font-family:inherit; font-weight:bold; letter-spacing:0.2em;
      font-size:clamp(1rem,5vw,1.6rem);
      background:#1a0800; border:2px solid var(--gold); border-radius:10px;
      color:var(--gold); cursor:pointer; padding:0.5em 2em;
      box-shadow:0 0 15px rgba(255,204,0,0.3); width:min(90vw,400px);
    }

    /* GAME */
    .game-title { font-size:clamp(1.2rem,5vw,2rem); font-weight:bold; letter-spacing:0.28em; text-shadow:0 0 12px rgba(255,204,0,0.6); margin:0.3em 0 0.1em; }
    .hud { display:flex; justify-content:space-between; align-items:center; width:min(90vw,90dvh); max-width:480px; padding:0.2em 0.5em; }
    .hud-item { display:flex; flex-direction:column; align-items:center; min-width:4em; }
    .hud-label { font-size:clamp(0.45rem,1.8vw,0.65rem); letter-spacing:0.15em; color:var(--dim); }
    .hud-val   { font-size:clamp(1rem,4vw,1.5rem); font-weight:bold; }
    #canvas-wrap {
      position:relative; width:min(90vw,90dvh); max-width:480px;
      margin:0.3em 0;
    }
    #canvas-wrap::before {
      content:''; position:absolute;
      inset:clamp(-6px,-1.2vw,-4px);
      border:clamp(4px,1vw,7px) solid #5a3a00;
      border-radius:clamp(6px,1.5vw,12px);
      box-shadow:0 0 20px rgba(90,58,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
      pointer-events:none; z-index:1;
    }
    #gameCanvas { display:block; width:100%; aspect-ratio:1; border-radius:clamp(3px,0.7vw,6px); touch-action:none; }
    .dpad {
      display:grid;
      grid-template-areas:". up ." "left . right" ". down .";
      grid-template-columns:repeat(3,clamp(2.8rem,13vw,4rem));
      grid-template-rows:repeat(3,clamp(2.8rem,13vw,4rem));
      gap:0.25rem; margin:0.4rem 0 0.2rem;
    }
    .dpad-btn {
      font-size:clamp(1rem,5vw,1.5rem);
      background:#1a0e00; border:2px solid var(--dim); border-radius:8px;
      color:var(--dim); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .dpad-btn:active { color:var(--gold); border-color:var(--gold); background:#2a1400; }
    .dpad-up    { grid-area:up; }
    .dpad-left  { grid-area:left; }
    .dpad-right { grid-area:right; }
    .dpad-down  { grid-area:down; }
    .ctrl-row { display:flex; gap:0.5rem; margin-top:0.2rem; }
    .ctrl-btn {
      font-family:inherit; font-weight:bold; letter-spacing:0.07em;
      font-size:clamp(0.58rem,2.3vw,0.82rem);
      background:#1a0e00; border:1.5px solid var(--dim); border-radius:8px;
      color:var(--dim); cursor:pointer; padding:0.4em 0.8em;
    }
    .ctrl-btn:active { color:var(--gold); border-color:var(--gold); background:#2a1400; }

    /* OVERLAYS */
    .overlay {
      display:none; position:fixed; inset:0; z-index:100;
      background:rgba(14,8,0,0.93);
      flex-direction:column; align-items:center; justify-content:center; gap:1rem;
    }
    .overlay.show { display:flex; }
    .ov-icon  { font-size:clamp(2.5rem,15vw,5rem); text-align:center; }
    .ov-title { font-size:clamp(1.5rem,8vw,3rem); font-weight:bold; letter-spacing:0.2em; color:var(--gold); text-shadow:0 0 20px rgba(255,204,0,0.6); text-align:center; }
    .ov-stats { font-size:clamp(0.7rem,3vw,1rem); color:var(--dim); letter-spacing:0.12em; text-align:center; line-height:1.8; }
    .ov-record { font-size:clamp(0.7rem,3vw,1rem); color:#ffaa00; letter-spacing:0.12em; text-align:center; }
    .ov-btns { display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; }
    .ov-btn {
      font-family:inherit; font-weight:bold; letter-spacing:0.15em;
      font-size:clamp(0.8rem,3.5vw,1.2rem);
      background:#1a0800; border:2px solid var(--gold); border-radius:10px;
      color:var(--gold); cursor:pointer; padding:0.5em 1.5em;
      box-shadow:0 0 10px rgba(255,204,0,0.3);
    }
    .name-entry-label { font-size:clamp(0.55rem,2.2vw,0.82rem); letter-spacing:0.18em; color:var(--dim); text-align:center; }
    .name-input {
      font-family:inherit; font-size:clamp(1.8rem,9vw,3rem); font-weight:900;
      letter-spacing:0.5em; text-align:center; text-transform:uppercase;
      background:#1a0c00; color:var(--gold);
      border:2.5px solid var(--gold); border-radius:8px;
      width:4.2em; padding:0.15em 0.2em; outline:none; caret-color:var(--gold);
    }
  </style>
</head>
<body>

<!-- ══ SETUP ══ -->
<div id="setup-screen" class="screen active">
  <h1>SNAKE</h1>
  <div class="subtitle">IL SERPENTE GOLOSO</div>
  <div class="diff-grid">
    <button class="diff-btn" id="diff-slow"   onclick="selDiff('slow')">🐢 LENTO</button>
    <button class="diff-btn" id="diff-normal" onclick="selDiff('normal')">▶ NORMALE</button>
    <button class="diff-btn" id="diff-fast"   onclick="selDiff('fast')">⚡ VELOCE</button>
  </div>
  <div class="records-box">
    <div class="rec-title" id="rec-title">RECORD — NORMALE</div>
    <div id="rec-list"></div>
  </div>
  <button class="start-btn" onclick="startGame()">▶ INIZIA</button>
</div>

<!-- ══ GAME ══ -->
<div id="game-screen" class="screen">
  <div class="game-title">SNAKE</div>
  <div class="hud">
    <div class="hud-item"><span class="hud-label">PUNTI</span><span class="hud-val" id="score-disp">0</span></div>
    <div class="hud-item"><span class="hud-label">RECORD</span><span class="hud-val" id="best-disp">0</span></div>
    <div class="hud-item"><span class="hud-label">LUNG.</span><span class="hud-val" id="len-disp">3</span></div>
  </div>
  <div id="canvas-wrap"><canvas id="gameCanvas"></canvas></div>
  <div class="dpad">
    <button class="dpad-btn dpad-up"    onpointerdown="inputDir(0,-1)">▲</button>
    <button class="dpad-btn dpad-left"  onpointerdown="inputDir(-1,0)">◀</button>
    <button class="dpad-btn dpad-right" onpointerdown="inputDir(1,0)">▶</button>
    <button class="dpad-btn dpad-down"  onpointerdown="inputDir(0,1)">▼</button>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn" id="pause-btn" onclick="togglePause()">⏸ PAUSA</button>
    <button class="ctrl-btn" onclick="backToSetup()">⚙ MENU</button>
  </div>
</div>

<!-- ══ NAME ENTRY OVERLAY ══ -->
<div class="overlay" id="name-overlay">
  <div class="ov-icon">🏆</div>
  <div class="ov-title">RECORD!</div>
  <div class="ov-stats" id="name-stats"></div>
  <div class="name-entry-label">INSERISCI LE TUE INIZIALI (MAX 3)</div>
  <input id="name-input" class="name-input" type="text" maxlength="3"
         autocomplete="off" autocorrect="off" autocapitalize="characters"
         spellcheck="false" placeholder="AAA"
         oninput="this.value=this.value.toUpperCase()"
         onkeydown="if(event.key==='Enter')confirmName()">
  <div class="ov-btns"><button class="ov-btn" onclick="confirmName()">✓ OK</button></div>
</div>

<!-- ══ GAME OVER OVERLAY ══ -->
<div class="overlay" id="overlay">
  <div class="ov-icon" id="ov-icon">💀</div>
  <div class="ov-title" id="ov-title">GAME OVER</div>
  <div class="ov-stats" id="ov-stats"></div>
  <div class="ov-record" id="ov-record"></div>
  <div class="ov-btns">
    <button class="ov-btn" onclick="restartGame()">↩ ANCORA</button>
    <button class="ov-btn" onclick="backToSetup()">⚙ MENU</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const GRID   = 20;
const SPEEDS = { slow:220, normal:130, fast:65 };
const DIFFS  = ['slow','normal','fast'];
const DNAMES = { slow:'LENTO', normal:'NORMALE', fast:'VELOCE' };
const CANVAS_RES = 400; // logical canvas resolution

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let snake=[], dir={dc:1,dr:0}, nextDir={dc:1,dr:0};
let apple={r:5,c:5};
let score=0, gameRunning=false, gamePaused=false;
let gameInterval=null, difficulty='normal';
let pendingScore=0, audioCtx=null;
let touchX0=0, touchY0=0;

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
canvas.width  = CANVAS_RES;
canvas.height = CANVAS_RES;

// ═══════════════════════════════════════════════
// RECORDS
// ═══════════════════════════════════════════════
const recKey = d => `snake_rec_${d}`;
function loadRec(d) { try { return JSON.parse(localStorage.getItem(recKey(d)))||[]; } catch(e){return[];} }
function inTop3(d,s){ const r=loadRec(d); return r.length<3||s>r[r.length-1].v; }
function saveRec(d,s,name){
  const nm=name?name.toUpperCase().slice(0,3).padEnd(3,'·'):'---';
  const r=loadRec(d); r.push({v:s,n:nm}); r.sort((a,b)=>b.v-a.v);
  const top=r.slice(0,3); localStorage.setItem(recKey(d),JSON.stringify(top)); return top;
}
function bestScore(d){ const r=loadRec(d); return r.length?r[0].v:0; }

function renderRecords(){
  const medals=['🥇','🥈','🥉'], el=document.getElementById('rec-list');
  const r=loadRec(difficulty);
  document.getElementById('rec-title').textContent=`RECORD — ${DNAMES[difficulty]}`;
  if(!r.length){ el.innerHTML='<div class="rec-empty">— nessun record —</div>'; return; }
  el.innerHTML='';
  r.forEach((e,i)=>{
    const d=document.createElement('div'); d.className='rec-row';
    d.innerHTML=`<span class="rec-rank">${medals[i]}</span><span class="rec-name">${e.n||'---'}</span><span class="rec-val">${e.v} pt</span>`;
    el.appendChild(d);
  });
}

// ═══════════════════════════════════════════════
// DIFFICULTY / SCREENS
// ═══════════════════════════════════════════════
function selDiff(d){
  difficulty=d;
  DIFFS.forEach(x=>document.getElementById('diff-'+x).classList.toggle('sel',x===d));
  renderRecords();
}
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function backToSetup(){ clearInterval(gameInterval); gameInterval=null; gameRunning=false; document.getElementById('overlay').classList.remove('show'); renderRecords(); showScreen('setup-screen'); }

// ═══════════════════════════════════════════════
// GAME INIT
// ═══════════════════════════════════════════════
function startGame(){
  const mid=Math.floor(GRID/2);
  snake=[{r:mid,c:mid},{r:mid,c:mid-1},{r:mid,c:mid-2}];
  dir={dc:1,dr:0}; nextDir={dc:1,dr:0};
  score=0; gamePaused=false;
  document.getElementById('pause-btn').textContent='⏸ PAUSA';
  showScreen('game-screen');
  placeApple(); updateHUD(); draw();
  gameRunning=true;
  gameInterval=setInterval(step, SPEEDS[difficulty]);
}

function restartGame(){ document.getElementById('overlay').classList.remove('show'); startGame(); }

// ═══════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════
function step(){
  if(!gameRunning||gamePaused) return;
  dir=nextDir;
  const head={r:snake[0].r+dir.dr, c:snake[0].c+dir.dc};
  if(head.r<0||head.r>=GRID||head.c<0||head.c>=GRID){ endGame(); return; }
  if(snake.some(s=>s.r===head.r&&s.c===head.c))     { endGame(); return; }
  snake.unshift(head);
  if(head.r===apple.r&&head.c===apple.c){ score++; soundEat(); placeApple(); }
  else snake.pop();
  updateHUD(); draw();
}

function endGame(){
  gameRunning=false;
  clearInterval(gameInterval); gameInterval=null;
  draw(); soundDie();
  const pts=score;
  if(inTop3(difficulty,pts)) setTimeout(()=>showNameEntry(pts),350);
  else                        setTimeout(()=>showGameOver(pts,false),350);
}

// ═══════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════
function inputDir(dc,dr){
  if(!gameRunning||gamePaused) return;
  getAC();
  if(dc!==0&&dir.dc!==0) return; // same axis — block
  if(dr!==0&&dir.dr!==0) return;
  nextDir={dc,dr};
}
function togglePause(){
  if(!gameRunning) return;
  gamePaused=!gamePaused;
  document.getElementById('pause-btn').textContent=gamePaused?'▶ RIPRENDI':'⏸ PAUSA';
  draw();
}
canvas.addEventListener('touchstart',e=>{ touchX0=e.touches[0].clientX; touchY0=e.touches[0].clientY; e.preventDefault(); },{passive:false});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX0, dy=e.changedTouches[0].clientY-touchY0;
  if(Math.abs(dx)<20&&Math.abs(dy)<20){ togglePause(); return; }
  Math.abs(dx)>Math.abs(dy)?inputDir(dx>0?1:-1,0):inputDir(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
document.addEventListener('keydown',e=>{
  const m={'ArrowUp':[0,-1],'ArrowDown':[0,1],'ArrowLeft':[-1,0],'ArrowRight':[1,0]};
  if(m[e.key]){ inputDir(...m[e.key]); e.preventDefault(); }
  if(e.key===' '){ togglePause(); e.preventDefault(); }
});

// ═══════════════════════════════════════════════
// APPLE
// ═══════════════════════════════════════════════
function placeApple(){
  const free=[];
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++) if(!snake.some(s=>s.r===r&&s.c===c)) free.push({r,c});
  if(free.length) apple=free[Math.floor(Math.random()*free.length)];
}

// ═══════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════
function updateHUD(){
  document.getElementById('score-disp').textContent=score;
  document.getElementById('best-disp').textContent=bestScore(difficulty);
  document.getElementById('len-disp').textContent=snake.length;
}

// ═══════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════
function draw(){
  const W=CANVAS_RES, cs=W/GRID;
  ctx.fillStyle='#0e0800'; ctx.fillRect(0,0,W,W);

  // grid lines
  ctx.strokeStyle='#1a0e00'; ctx.lineWidth=0.5;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath(); ctx.moveTo(i*cs,0); ctx.lineTo(i*cs,W); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*cs); ctx.lineTo(W,i*cs); ctx.stroke();
  }

  // apple
  const ax=apple.c*cs+cs/2, ay=apple.r*cs+cs/2, ar=cs*0.36;
  const ag=ctx.createRadialGradient(ax,ay,0,ax,ay,ar*2.2);
  ag.addColorStop(0,'rgba(255,60,60,0.35)'); ag.addColorStop(1,'rgba(255,60,60,0)');
  ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(ax,ay,ar*2.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff3333'; ctx.beginPath(); ctx.arc(ax,ay,ar,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,150,150,0.7)'; ctx.beginPath(); ctx.arc(ax-ar*0.28,ay-ar*0.28,ar*0.28,0,Math.PI*2); ctx.fill();

  // snake body (tail → neck)
  for(let i=snake.length-1;i>=1;i--){
    const s=snake[i], t=i/snake.length;
    const pad=cs*0.11, r=cs*0.18;
    const alpha=0.4+t*0.6;
    ctx.fillStyle=`rgba(190,120,0,${alpha})`;
    rrect(ctx, s.c*cs+pad, s.r*cs+pad, cs-pad*2, cs-pad*2, r);
    ctx.fill();
  }

  // head
  if(snake.length){
    const h=snake[0], pad=cs*0.05, r=cs*0.22;
    ctx.fillStyle='#ffcc00';
    ctx.shadowColor='rgba(255,204,0,0.55)'; ctx.shadowBlur=cs*0.6;
    rrect(ctx, h.c*cs+pad, h.r*cs+pad, cs-pad*2, cs-pad*2, r);
    ctx.fill();
    ctx.shadowBlur=0;
    // eyes
    const cx=h.c*cs+cs*0.5+dir.dc*cs*0.12, cy=h.r*cs+cs*0.5+dir.dr*cs*0.12;
    const px=dir.dr*cs*0.2, py=-dir.dc*cs*0.2;
    ctx.fillStyle='#1a0c00';
    ctx.beginPath(); ctx.arc(cx+px,cy+py,cs*0.09,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-px,cy-py,cs*0.09,0,Math.PI*2); ctx.fill();
  }

  // pause overlay
  if(gamePaused){
    ctx.fillStyle='rgba(14,8,0,0.72)'; ctx.fillRect(0,0,W,W);
    ctx.fillStyle='#ffcc00'; ctx.font=`bold ${cs*1.4}px 'Courier New'`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('PAUSA',W/2,W/2);
    ctx.textAlign='start'; ctx.textBaseline='alphabetic';
  }
}

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ═══════════════════════════════════════════════
// NAME ENTRY
// ═══════════════════════════════════════════════
function showNameEntry(pts){
  pendingScore=pts;
  document.getElementById('name-stats').innerHTML=`Punteggio: <b>${pts}</b> punti&nbsp;&nbsp;Lunghezza: ${snake.length}`;
  const inp=document.getElementById('name-input'); inp.value='';
  document.getElementById('name-overlay').classList.add('show');
  setTimeout(()=>inp.focus(),80);
}
function confirmName(){
  const name=document.getElementById('name-input').value.trim()||'---';
  document.getElementById('name-overlay').classList.remove('show');
  saveRec(difficulty,pendingScore,name);
  updateHUD();
  showGameOver(pendingScore,true);
}

// ═══════════════════════════════════════════════
// GAME OVER
// ═══════════════════════════════════════════════
function showGameOver(pts,isRec){
  document.getElementById('ov-icon').textContent='💀';
  document.getElementById('ov-title').textContent='GAME OVER';
  document.getElementById('ov-stats').innerHTML=`Punteggio: ${pts} punti<br>Lunghezza: ${snake.length}`;
  document.getElementById('ov-record').textContent=isRec?'🥇 Nuovo record!':'';
  document.getElementById('overlay').classList.add('show');
}

// ═══════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════
function getAC(){ if(!audioCtx) try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume(); }
function beep(freq,dur,type='square',vol=0.07){ if(!audioCtx)return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g);g.connect(audioCtx.destination); o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime); g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur); o.start();o.stop(audioCtx.currentTime+dur); }
function soundEat(){ getAC(); beep(440,0.055,'square',0.07); setTimeout(()=>beep(660,0.055,'square',0.05),55); }
function soundDie(){ getAC(); beep(220,0.1,'sawtooth',0.1); setTimeout(()=>beep(165,0.15,'sawtooth',0.08),110); setTimeout(()=>beep(110,0.3,'sawtooth',0.06),230); }
