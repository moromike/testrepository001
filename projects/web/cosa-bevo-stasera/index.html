<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cosa Bevo Stasera?</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #16161f;
      --accent: #7c3aed;
      --accent2: #ec4899;
      --text: #f0f0ff;
      --muted: #666680;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow: hidden;
    }

    /* ── SCREENS ─────────────────────────────────────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ── CONFIG ──────────────────────────────────────────────────────────── */
    #config {
      justify-content: flex-start;
      overflow-y: auto;
      padding-top: 3rem;
      padding-bottom: 2rem;
      gap: 1.25rem;
    }

    .app-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .app-subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      margin-top: -0.5rem;
    }

    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      align-self: flex-start;
      width: 100%;
      max-width: 400px;
    }

    .face-selector {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }

    .face-btn {
      padding: 0.45rem 1.1rem;
      border-radius: 100px;
      border: 2px solid var(--muted);
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .face-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .drinks-list {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .drink-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      border-radius: 12px;
      padding: 0.7rem 1rem;
      animation: slide-in 0.22s ease both;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-14px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .drink-num  { font-size: 0.7rem; color: var(--muted); min-width: 1.2rem; text-align: right; }
    .drink-icon { font-size: 1.4rem; min-width: 2rem; text-align: center; display: inline-block; }

    .drink-icon.pop {
      animation: icon-pop 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes icon-pop {
      0%   { transform: scale(1) rotate(0deg); }
      40%  { transform: scale(1.75) rotate(-12deg); }
      70%  { transform: scale(0.88) rotate(6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .drink-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }
    .drink-input::placeholder { color: var(--muted); }

    .launch-btn {
      width: 100%;
      max-width: 400px;
      padding: 1.1rem;
      border-radius: 100px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.15s, opacity 0.15s;
      margin-top: 0.25rem;
    }
    .launch-btn:active { transform: scale(0.97); opacity: 0.9; }

    /* ── PRESENTATION ────────────────────────────────────────────────────── */
    #presentation { gap: 1.5rem; text-align: center; }

    .pres-text {
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.6;
      max-width: 340px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .pres-text.show { opacity: 1; transform: translateY(0); }

    .countdown {
      font-size: 9rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      transform: scale(2.5);
      transition: opacity 0.15s, transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .countdown.show { opacity: 1; transform: scale(1); }
    .countdown.hide { opacity: 0; transform: scale(0.3); transition: opacity 0.2s, transform 0.2s ease-in; }

    /* ── ROLLING ─────────────────────────────────────────────────────────── */
    #rolling { gap: 0; }

    .rolling-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* slot-machine number above the cube */
    .slot-counter {
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      min-height: 4.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      font-variant-numeric: tabular-nums;
      transition: opacity 0.4s;
    }

    .scene-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 220px;
    }

    .cube-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle,
        color-mix(in srgb, var(--accent) 45%, transparent) 0%,
        transparent 70%
      );
      animation: glow-pulse 1s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes glow-pulse {
      from { opacity: 0.4; transform: scale(0.9); }
      to   { opacity: 1;   transform: scale(1.15); }
    }

    .scene { perspective: 700px; width: 160px; height: 160px; }

    .cube {
      width: 160px;
      height: 160px;
      position: relative;
      transform-style: preserve-3d;
    }

    .cube.rolling {
      animation:
        dice-roll 2.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards,
        dice-blur 2.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    @keyframes dice-roll {
      0%   { transform: rotateX(  0deg) rotateY(   0deg) rotateZ(  0deg); }
      15%  { transform: rotateX(200deg) rotateY( 340deg) rotateZ( 80deg); }
      35%  { transform: rotateX(520deg) rotateY( 700deg) rotateZ(200deg); }
      55%  { transform: rotateX(880deg) rotateY(1100deg) rotateZ(290deg); }
      75%  { transform: rotateX(1040deg) rotateY(1340deg) rotateZ(340deg); }
      100% { transform: rotateX(1080deg) rotateY(1440deg) rotateZ(360deg); }
    }

    /* motion blur: peaks during fast spin, dissolves as it slows */
    @keyframes dice-blur {
      0%   { filter: blur(0px);  }
      12%  { filter: blur(10px); }
      45%  { filter: blur(7px);  }
      78%  { filter: blur(2px);  }
      100% { filter: blur(0px);  }
    }

    .face {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      border: 2px solid rgba(255,255,255,0.12);
      background: linear-gradient(145deg,
        color-mix(in srgb, var(--accent) 35%, var(--surface)),
        color-mix(in srgb, var(--accent2) 25%, var(--surface))
      );
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .face small { font-size: 0.6rem; color: rgba(255,255,255,0.4); margin-top: 0.3rem; letter-spacing: 0.05em; }

    .face-front  { transform: translateZ(80px); }
    .face-back   { transform: rotateY(180deg) translateZ(80px); }
    .face-right  { transform: rotateY( 90deg) translateZ(80px); }
    .face-left   { transform: rotateY(-90deg) translateZ(80px); }
    .face-top    { transform: rotateX( 90deg) translateZ(80px); }
    .face-bottom { transform: rotateX(-90deg) translateZ(80px); }

    /* ── RESULT ──────────────────────────────────────────────────────────── */
    #result { gap: 1.25rem; }

    .result-card {
      background: var(--surface);
      border-radius: 28px;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      width: 100%;
      max-width: 320px;
      border: 1px solid rgba(255,255,255,0.07);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .result-card.show { opacity: 1; transform: scale(1); }

    .result-icon {
      font-size: 5.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .result-card.show .result-icon {
      animation: icon-bounce 0.5s 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes icon-bounce {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .result-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-bottom: 0.3rem;
      opacity: 0;
      transition: opacity 0.4s 0.55s ease;
    }
    .result-card.show .result-label { opacity: 1; }

    .result-drink {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      min-height: 2.4rem;
    }

    /* blinking cursor during typewriter */
    .result-drink.typing::after {
      content: '|';
      -webkit-text-fill-color: var(--accent2);
      animation: blink 0.6s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .result-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.6rem;
      opacity: 0;
      transition: opacity 0.4s 0.9s ease;
    }
    .result-card.show .result-meta { opacity: 1; }

    .again-btn {
      padding: 0.9rem 2.5rem;
      border-radius: 100px;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.4s ease, transform 0.4s ease, background 0.2s, color 0.2s;
    }
    .again-btn.show { opacity: 1; transform: translateY(0); }
    .again-btn:hover { background: var(--accent); }

    /* ── CONFETTI ────────────────────────────────────────────────────────── */
    #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

    .cp {
      position: absolute;
      left: 0; top: 0;
      opacity: 0;
      will-change: transform;
    }

    .cp.burst {
      animation: cp-fly var(--dur) cubic-bezier(0.2, 0.8, 0.4, 1) var(--delay) forwards;
    }

    @keyframes cp-fly {
      0%   { transform: translate(var(--ox), var(--oy)) rotate(0deg);            opacity: 1;   }
      65%  { opacity: 1; }
      100% { transform: translate(var(--ex), var(--ey)) rotate(var(--spin));     opacity: 0;   }
    }
  </style>
</head>
<body>

<div id="confetti"></div>

<!-- ── CONFIG ────────────────────────────────────────────────────────────── -->
<div id="config" class="screen active">
  <a href="../index.html" style="align-self:flex-start;font-size:.68rem;padding:4px 10px;background:#1a0d00;border:1px solid #4a3200;color:#886600;border-radius:5px;text-decoration:none;font-family:'Courier New',monospace;letter-spacing:.05em;margin:6px 0 0 8px">◀ ARCADE</a>
  <div class="app-title">🎲 Cosa Bevo Stasera?</div>
  <div class="app-subtitle">Lascia al dado la decisione più importante</div>

  <div class="section-label">Numero di facce</div>
  <div class="face-selector" id="faceSelector">
    <button class="face-btn active" data-faces="6">d6</button>
    <button class="face-btn" data-faces="8">d8</button>
    <button class="face-btn" data-faces="10">d10</button>
    <button class="face-btn" data-faces="12">d12</button>
    <button class="face-btn" data-faces="20">d20</button>
  </div>

  <div class="section-label">Le bevande</div>
  <div class="drinks-list" id="drinksList"></div>

  <button class="launch-btn" id="launchBtn">🎲 &nbsp;LANCIA IL DADO</button>
</div>

<!-- ── PRESENTATION ──────────────────────────────────────────────────────── -->
<div id="presentation" class="screen">
  <p class="pres-text" id="presText"></p>
  <div class="countdown" id="countdown"></div>
</div>

<!-- ── ROLLING ───────────────────────────────────────────────────────────── -->
<div id="rolling" class="screen">
  <div class="rolling-label">Il dado sta rotolando…</div>
  <div class="slot-counter" id="slotCounter">&nbsp;</div>
  <div class="scene-wrap">
    <div class="cube-glow"></div>
    <div class="scene">
      <div class="cube" id="cube">
        <div class="face face-front"  id="face0"></div>
        <div class="face face-right"  id="face1"></div>
        <div class="face face-back"   id="face2"></div>
        <div class="face face-left"   id="face3"></div>
        <div class="face face-top"    id="face4"></div>
        <div class="face face-bottom" id="face5"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── RESULT ────────────────────────────────────────────────────────────── -->
<div id="result" class="screen">
  <div class="result-card" id="resultCard">
    <span class="result-icon" id="resultIcon"></span>
    <div class="result-label">Oggi si beve</div>
    <div class="result-drink" id="resultDrink"></div>
    <div class="result-meta"  id="resultMeta"></div>
  </div>
  <button class="again-btn" id="againBtn">🎲 &nbsp;Ancora una volta</button>
</div>

<script>
// ── ICON DATABASE ────────────────────────────────────────────────────────────
const ICON_DB = [
  { keys: ['acqua naturale', 'still water', 'acqua liscia', 'natural water'], icon: '💧' },
  { keys: ['acqua frizzante', 'sparkling', 'frizzante', 'soda water'],        icon: '🫧' },
  { keys: ['coca', 'coke', 'cola', 'pepsi', 'fanta', 'sprite', 'aranciata'], icon: '🥤' },
  { keys: ['vino', 'wine', 'rosso', 'bianco', 'rosé', 'rose', 'chianti'],    icon: '🍷' },
  { keys: ['birra', 'beer', 'bier', 'ale', 'lager', 'ipa'],                  icon: '🍺' },
  { keys: ['whisky', 'whiskey', 'scotch', 'bourbon', 'rum', 'vodka', 'tequila', 'gin', 'grappa'], icon: '🥃' },
  { keys: ['champagne', 'prosecco', 'spumante', 'bollicine', 'cava'],         icon: '🥂' },
  { keys: ['cocktail', 'aperol', 'spritz', 'mojito', 'negroni', 'sbagliato'], icon: '🍹' },
  { keys: ['succo', 'juice', 'smoothie', 'centrifuga', 'frullato'],           icon: '🧃' },
  { keys: ['tè', 'the', 'tea', 'iced tea', 'matcha'],                         icon: '🍵' },
  { keys: ['caffè', 'caffe', 'coffee', 'espresso', 'cappuccino'],             icon: '☕' },
  { keys: ['latte', 'milk', 'latte macchiato'],                               icon: '🥛' },
  { keys: ['acqua', 'water'],                                                 icon: '💧' },
];

function getIcon(name) {
  const low = name.toLowerCase();
  for (const { keys, icon } of ICON_DB) {
    if (keys.some(k => low.includes(k))) return icon;
  }
  return '🍶';
}

// ── STATE ────────────────────────────────────────────────────────────────────
const DEFAULTS = ['Acqua naturale','Coca Cola','Vino','Acqua frizzante','Birra','Whisky',
                  'Prosecco','Cocktail','Succo','Tè','Caffè','Latte',
                  'Rum','Vodka','Gin','Tequila','Aperol Spritz','Mojito','Negroni','Birra artigianale'];

let faces  = 6;
let drinks = [...DEFAULTS];

// ── RENDER CONFIG ────────────────────────────────────────────────────────────
function renderDrinks() {
  const list = document.getElementById('drinksList');
  list.innerHTML = '';
  for (let i = 0; i < faces; i++) {
    const val  = drinks[i] || '';
    const icon = val ? getIcon(val) : '❓';
    const row  = document.createElement('div');
    row.className = 'drink-item';
    row.style.animationDelay = `${i * 35}ms`;
    row.innerHTML = `
      <span class="drink-num">${i + 1}</span>
      <span class="drink-icon" id="icon-${i}">${icon}</span>
      <input class="drink-input" id="inp-${i}" value="${val}" placeholder="Bevanda ${i + 1}" maxlength="30">
    `;
    list.appendChild(row);

    const input   = row.querySelector(`#inp-${i}`);
    const iconEl  = row.querySelector(`#icon-${i}`);
    let lastIcon  = icon;

    input.addEventListener('input', e => {
      drinks[i] = e.target.value;
      const newIcon = e.target.value ? getIcon(e.target.value) : '❓';
      if (newIcon !== lastIcon) {
        iconEl.textContent = newIcon;
        iconEl.classList.remove('pop');
        void iconEl.offsetWidth; // force reflow to restart animation
        iconEl.classList.add('pop');
        lastIcon = newIcon;
      }
    });
  }
}

document.getElementById('faceSelector').addEventListener('click', e => {
  const btn = e.target.closest('.face-btn');
  if (!btn) return;
  document.querySelectorAll('.face-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  faces = +btn.dataset.faces;
  renderDrinks();
});

renderDrinks();

// ── HELPERS ──────────────────────────────────────────────────────────────────
const showScreen = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

function syncDrinks() {
  for (let i = 0; i < faces; i++) {
    const el = document.getElementById(`inp-${i}`);
    if (el) drinks[i] = el.value.trim() || DEFAULTS[i] || `Bevanda ${i + 1}`;
  }
}

// ── SLOT COUNTER ─────────────────────────────────────────────────────────────
function startSlot(maxFaces, finalNum) {
  const el = document.getElementById('slotCounter');
  el.style.opacity = '1';
  let count = 0;
  const totalTicks = 32;

  (function tick() {
    count++;
    if (count < totalTicks) {
      el.textContent = Math.floor(Math.random() * maxFaces) + 1;
      const delay = count < 14 ? 55 : count < 24 ? 110 : 210;
      setTimeout(tick, delay);
    } else {
      el.textContent = finalNum;
      setTimeout(() => { el.style.opacity = '0'; }, 700);
    }
  })();
}

// ── CONFETTI ──────────────────────────────────────────────────────────────────
function spawnConfetti() {
  const container = document.getElementById('confetti');
  container.innerHTML = '';
  const colors = ['#7c3aed','#ec4899','#f59e0b','#10b981','#3b82f6','#f97316','#a855f7','#06b6d4','#fbbf24'];
  const cx = window.innerWidth  / 2;
  const cy = window.innerHeight / 2;
  const N  = 20;

  for (let i = 0; i < N; i++) {
    const p     = document.createElement('div');
    p.className = 'cp';

    const angle  = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
    const dist   = 110 + Math.random() * 150;
    const size   = 7 + Math.random() * 11;
    const isRect = Math.random() > 0.45;
    const spin   = (Math.random() - 0.5) * 900;
    const dur    = (0.55 + Math.random() * 0.55).toFixed(2);
    const delay  = (Math.random() * 0.12).toFixed(2);
    const ex     = cx + Math.cos(angle) * dist;
    const ey     = cy + Math.sin(angle) * dist;

    p.style.cssText = `
      width: ${size}px;
      height: ${isRect ? (size * 0.4).toFixed(1) : size}px;
      border-radius: ${isRect ? '2px' : '50%'};
      background: ${colors[i % colors.length]};
      --ox: ${cx.toFixed(1)}px; --oy: ${cy.toFixed(1)}px;
      --ex: ${ex.toFixed(1)}px; --ey: ${ey.toFixed(1)}px;
      --spin: ${spin.toFixed(0)}deg;
      --dur: ${dur}s; --delay: ${delay}s;
    `;
    container.appendChild(p);
    void p.offsetWidth;
    p.classList.add('burst');
  }

  setTimeout(() => { container.innerHTML = ''; }, 1600);
}

// ── TYPEWRITER ────────────────────────────────────────────────────────────────
function typewriter(el, text, speed = 58) {
  return new Promise(resolve => {
    el.textContent = '';
    el.classList.add('typing');
    let i = 0;
    (function next() {
      if (i < text.length) {
        el.textContent += text[i++];
        setTimeout(next, speed);
      } else {
        el.classList.remove('typing');
        resolve();
      }
    })();
  });
}

// ── MAIN SEQUENCE ─────────────────────────────────────────────────────────────
document.getElementById('launchBtn').addEventListener('click', run);
document.getElementById('againBtn').addEventListener('click', () => showScreen('config'));

async function run() {
  syncDrinks();
  const pool   = drinks.slice(0, faces).map((d, i) => d || DEFAULTS[i] || `Bevanda ${i + 1}`);
  const picked = Math.floor(Math.random() * faces);
  const winner = pool[picked];

  // ── PRESENTATION ──
  showScreen('presentation');
  const presEl = document.getElementById('presText');
  const cdEl   = document.getElementById('countdown');
  presEl.textContent = 'Carissimi… pronti a scoprire cosa si beve stasera? 🎉';
  cdEl.className     = 'countdown';
  cdEl.textContent   = '';
  await sleep(80);
  presEl.classList.add('show');
  await sleep(2200);
  presEl.classList.remove('show');
  await sleep(550);

  for (const n of ['3', '2', '1']) {
    cdEl.className   = 'countdown';
    cdEl.textContent = n;
    await sleep(40);
    cdEl.classList.add('show');
    await sleep(680);
    cdEl.classList.add('hide');
    await sleep(280);
  }
  await sleep(150);

  // ── ROLLING ──
  showScreen('rolling');
  for (let i = 0; i < 6; i++) {
    const f = document.getElementById(`face${i}`);
    const d = pool[i % faces];
    f.innerHTML = `${getIcon(d)}<small>${i + 1}</small>`;
  }
  const cube = document.getElementById('cube');
  cube.className = 'cube';
  await sleep(30);
  cube.classList.add('rolling');
  startSlot(faces, picked + 1);
  await sleep(2900);

  // ── RESULT ──
  showScreen('result');
  document.getElementById('resultIcon').textContent  = getIcon(winner);
  document.getElementById('resultDrink').textContent = '';
  document.getElementById('resultMeta').textContent  = `Faccia ${picked + 1} su ${faces}`;

  const card     = document.getElementById('resultCard');
  const againBtn = document.getElementById('againBtn');
  card.className     = 'result-card';
  againBtn.className = 'again-btn';
  await sleep(80);
  card.classList.add('show');
  await sleep(650);

  await typewriter(document.getElementById('resultDrink'), winner.toUpperCase(), 60);
  spawnConfetti();
  await sleep(350);
  againBtn.classList.add('show');
}
</script>
</body>
</html>
